schema: papr_ssl.p4_layer_sweep_candidates.v1
phase: P4-01
index_semantics: exact outputs.hidden_states tuple index; not a paper layer number
candidate_policy: all P1-validated hidden-state indices
selection:
  metric: generic_dev_score
  metric_definition: prototype_macro_f1
  direction: maximize
  aggregation: mean_over_seeds_17_29_43
  confidence_interval: two-sided 95% Student-t, df=2
  exact_mean_tie_break: lower_hidden_state_index
  generic_test: sealed_not_accessed
training_contract:
  task_view: mdsc_core30_exact_phrase
  head: mean_dr
  embedding_dim: 64
  l2_normalize: true
  scaf:
    k: 3
    margin: 0.2
    scale: 30
  seeds:
  - 17
  - 29
  - 43
  epochs: 20
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 5.0
  classes_per_batch: 8
  samples_per_class: 4
