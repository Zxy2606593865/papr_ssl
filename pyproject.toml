[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papr-ssl"
version = "0.1.0"
description = "SSL-teacher embeddings for personalized atypical-speech recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.1",
    "transformers>=4.40",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
